<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mchiBET</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --purple:#9998d0; --purple-d:#8a88bd; --panel:#f4f4ff; --ink:#26263a; --bg:#c9c9d1; --green:#2fd62f;
  --s:1;--nav:calc(78px*var(--s)); box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1c1c28;font-family:'Barlow',system-ui,sans-serif;color:var(--ink)}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
.ico{background:var(--green);border-radius:calc(3px*var(--s));flex:none}
#app{position:relative;height:100%;max-width:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:0 calc(14px*var(--s));height:calc(62px*var(--s));flex:none;background:linear-gradient(90deg,var(--purple-d),var(--purple));color:#e8e8ee}
header .l,header .r{display:flex;align-items:center;gap:calc(14px*var(--s))}
#menuBtn{background:none;border:0;padding:0;cursor:pointer}
#menuBtn .ico{width:calc(56px*var(--s));height:calc(56px*var(--s))}
.logo{width:calc(120px*var(--s));height:calc(52px*var(--s))}
.bal{font-size:calc(28px*var(--s));letter-spacing:calc(1px*var(--s))}
.user{width:calc(36px*var(--s));height:calc(36px*var(--s))}
main{flex:1;overflow-y:auto;padding:calc(22px*var(--s)) calc(24px*var(--s)) calc(24px*var(--s))}
main.pad{padding-bottom:calc(170px*var(--s))}
.event-h{background:var(--purple);border-radius:calc(26px*var(--s)) calc(26px*var(--s)) 0 0;padding:calc(20px*var(--s)) calc(22px*var(--s)) calc(34px*var(--s));display:flex;gap:calc(12px*var(--s));color:#ececf2}
.flag{width:calc(38px*var(--s));height:calc(38px*var(--s));border-radius:50%}
.event-h h1{font-size:calc(30px*var(--s));font-weight:700;line-height:1}
.event-h p{font-size:calc(19px*var(--s));margin-top:calc(6px*var(--s));letter-spacing:calc(1px*var(--s))}
.card{background:var(--panel);border-radius:calc(22px*var(--s));margin-top:calc(-22px*var(--s));padding:calc(20px*var(--s)) calc(18px*var(--s)) calc(26px*var(--s));position:relative}
.card h2{font-size:calc(25px*var(--s));font-weight:700;padding:0 calc(6px*var(--s)) calc(14px*var(--s))}
.row{display:flex;align-items:center;gap:calc(10px*var(--s));padding:calc(10px*var(--s)) 0;min-height:calc(86px*var(--s))}
.num{width:calc(34px*var(--s));text-align:center;font-size:calc(44px*var(--s));font-weight:700;flex:none}
.silk{width:calc(62px*var(--s));height:calc(62px*var(--s));flex:none}
.info{flex:1;min-width:0;font-size:calc(16px*var(--s));line-height:1.22}
.info b{font-size:calc(19px*var(--s));display:block}
.odds{flex:none;width:calc(68px*var(--s));height:calc(56px*var(--s));border-radius:calc(14px*var(--s));border:calc(3px*var(--s)) solid var(--purple);background:var(--purple);color:var(--ink);font:700 calc(28px*var(--s)) 'Barlow',sans-serif;cursor:pointer;transition:background .15s,color .15s}
.odds.sel{background:var(--ink);border-color:var(--ink);color:var(--purple)}
#slip{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + calc(78px*var(--s)));background:var(--purple);border-radius:calc(26px*var(--s)) calc(26px*var(--s)) 0 0;transform:translateY(100%);transition:transform .35s ease,height .3s ease;padding:calc(14px*var(--s)) calc(20px*var(--s));color:var(--ink)}
#slip.show{transform:none}
#slip.open{height:calc(var(--nav) + calc(280px*var(--s)))}
#slip .chev{position:absolute;right:calc(22px*var(--s));top:calc(12px*var(--s));width:calc(34px*var(--s));height:calc(26px*var(--s));border:0;cursor:pointer;transition:transform .3s}
#slip.open .chev{transform:rotate(180deg)}
#slip .body{padding-top:calc(30px*var(--s));font-size:calc(17px*var(--s));line-height:1.35;opacity:0;transition:opacity .2s}
#slip.open .body{opacity:1}
nav{position:relative;z-index:5;flex:none;height:var(--nav);background:var(--panel);border-radius:calc(22px*var(--s)) calc(22px*var(--s)) 0 0;display:flex;justify-content:space-around;align-items:center;margin-top:calc(-22px*var(--s));padding-top:calc(6px*var(--s))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:calc(4px*var(--s));font:700 calc(22px*var(--s)) 'Barlow',sans-serif;color:var(--ink);cursor:pointer;width:33%}
nav .ico{width:calc(40px*var(--s));height:calc(38px*var(--s))}
.mybets{display:none;padding:calc(60px*var(--s)) calc(20px*var(--s));text-align:center;font-size:calc(22px*var(--s))}
#scrim{position:absolute;inset:0;background:rgba(20,20,35,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:88%;background:var(--panel);z-index:11;transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto;padding:calc(20px*var(--s)) calc(18px*var(--s)) calc(40px*var(--s))}
#drawer.show{transform:none}
#drawer h3{font-size:calc(24px*var(--s));margin-bottom:calc(4px*var(--s))}
#drawer .sub{font-size:calc(14px*var(--s));opacity:.7;margin-bottom:calc(16px*var(--s))}
#drawer fieldset{border:calc(2px*var(--s)) solid var(--purple);border-radius:calc(14px*var(--s));padding:calc(12px*var(--s));margin-bottom:calc(14px*var(--s))}
#drawer legend{font-weight:700;padding:0 calc(6px*var(--s))}
#drawer label{display:block;font-size:calc(13px*var(--s));margin-top:calc(8px*var(--s))}
#drawer input{width:100%;font:calc(16px*var(--s)) 'Barlow',sans-serif;padding:calc(7px*var(--s)) calc(9px*var(--s));border:calc(2px*var(--s)) solid #cfcfe6;border-radius:calc(8px*var(--s));background:#fff;color:var(--ink)}
#drawer input:focus{outline:calc(3px*var(--s)) solid var(--purple);border-color:var(--purple)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px*var(--s))}
#close{float:right;border:0;background:var(--purple);border-radius:calc(8px*var(--s));font:700 calc(16px*var(--s)) 'Barlow',sans-serif;padding:calc(7px*var(--s)) calc(14px*var(--s));cursor:pointer;color:var(--ink)}
button:focus-visible{outline:calc(3px*var(--s)) solid var(--ink);outline-offset:calc(2px*var(--s))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.silk img{width:100%;height:100%;object-fit:contain;display:block}
details{margin-top:calc(10px*var(--s))}
summary{cursor:pointer;font-weight:700;font-size:calc(14px*var(--s))}
.jgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(6px*var(--s));margin-top:calc(8px*var(--s))}
.jb{aspect-ratio:1;border:2px solid #cfcfe6;border-radius:8px;background:#fff;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font:700 calc(10px*var(--s)) 'Barlow',sans-serif}
.jb img{width:100%;height:100%;object-fit:contain}
.jb span{display:none}
.jb.nofile{background:var(--green)}
.jb.nofile span{display:block}
.jb.on{border-color:var(--ink);outline:3px solid var(--purple)}
.icn{flex:none;display:block}
.icn img{width:100%;height:100%;object-fit:contain;display:block}
#menuBtn .icn{width:calc(56px*var(--s));height:calc(56px*var(--s))}
.icn.logo{width:calc(110px*var(--s));height:calc(54px*var(--s))}
nav .icn{width:calc(40px*var(--s));height:calc(38px*var(--s))}
#slip .chev{background:none;padding:0}
.chev .icn{width:100%;height:100%}
header{display:grid;grid-template-columns:1fr auto 1fr}
header .l{justify-self:start}
header .r{justify-self:end}
header{height:calc(80px*var(--s))}
.icn.logo{width:calc(130px*var(--s));height:calc(72px*var(--s))}
.bal{font-size:calc(17px*var(--s));letter-spacing:0;white-space:nowrap}
.msg{font-weight:700;font-size:calc(20px*var(--s));line-height:1.15;padding-right:calc(48px*var(--s))}
#slip .body{padding-top:calc(16px*var(--s))}
#drawer label.chk{display:flex;align-items:center;margin-top:calc(12px*var(--s));font-size:calc(14px*var(--s))}
#drawer label.chk input{width:auto;margin-right:calc(8px*var(--s))}
#slip{color:#fff;height:calc(var(--nav) + calc(96px*var(--s)))}
#slip.open{height:calc(var(--nav) + calc(300px*var(--s)))}
.msg{color:#fff;text-align:center;font-weight:400;font-size:calc(28px*var(--s));padding:0 calc(48px*var(--s))}
.msg b{font-weight:700}
main.pad{padding-bottom:calc(190px*var(--s))}
#slip{cursor:pointer}
#confirm{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(30,30,50,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#confirm.show{opacity:1;pointer-events:auto}
.cbox{width:75%;background:#f4f4ff;border-radius:calc(22px*var(--s));padding:calc(34px*var(--s)) calc(26px*var(--s)) calc(30px*var(--s));text-align:center;color:var(--ink)}
.cbox h2{font-size:calc(54px*var(--s));line-height:1.05;color:#00009e;font-weight:700;letter-spacing:calc(1px*var(--s))}
.cbox p{margin:calc(26px*var(--s)) 0 calc(44px*var(--s));font-size:calc(27px*var(--s));line-height:1.2;font-weight:500}
.cbox p b{font-weight:700}
.cbtns{display:flex;gap:calc(14px*var(--s))}
.cbtns button{flex:1;height:calc(54px*var(--s));border:0;border-radius:calc(8px*var(--s));font:700 calc(26px*var(--s)) 'Barlow',sans-serif;color:var(--ink);cursor:pointer}
#cYes{background:var(--purple)}
#cNo{background:#e4e4fc}
#luck{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(30,30,50,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#luck.show{opacity:1;pointer-events:auto}
.lbox{position:relative;width:72%;height:62%;background:#f4f4ff;border-radius:calc(22px*var(--s));display:flex;align-items:center;justify-content:center;padding:calc(20px*var(--s))}
.lbox h2{font-size:calc(76px*var(--s));line-height:1.1;color:#00009e;text-align:center;font-weight:700;letter-spacing:calc(1px*var(--s))}
#lClose{position:absolute;top:calc(14px*var(--s));right:calc(14px*var(--s));background:none;border:0;padding:calc(6px*var(--s));cursor:pointer;color:var(--purple);line-height:0}
#lClose svg{width:calc(34px*var(--s));height:calc(34px*var(--s));display:block}
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.mybets{padding:calc(24px*var(--s)) calc(38px*var(--s)) calc(100px*var(--s));text-align:left;font-size:calc(21px*var(--s))}
.wcard{border-radius:calc(16px*var(--s));overflow:hidden;background:#fff}
.wtop{padding:calc(22px*var(--s)) calc(14px*var(--s)) calc(30px*var(--s))}
.wtop h1{font-size:calc(46px*var(--s));line-height:1.08;font-weight:700}
.wtop p{margin:calc(14px*var(--s)) 0 calc(18px*var(--s)) calc(8px*var(--s));font-size:calc(22px*var(--s));line-height:1.22;font-weight:500}
.wtop p b{font-weight:700}
.wbtn{border:0;border-radius:calc(8px*var(--s));font:500 calc(34px*var(--s)) 'Barlow',sans-serif;color:var(--ink);padding:calc(8px*var(--s));cursor:pointer}
.wbtn.light{background:#dcdcff}
.wbtn.dark{background:#7b79bd}
.whist{background:var(--purple);padding:calc(26px*var(--s)) calc(14px*var(--s)) calc(30px*var(--s))}
.whist h2{font-size:calc(28px*var(--s));color:#fff;font-weight:700;margin-bottom:calc(14px*var(--s))}
#result{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(30,30,50,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#result.show{opacity:1;pointer-events:auto}
.rbox{padding:calc(26px*var(--s)) calc(22px*var(--s))}
.rbanner{border-radius:calc(16px*var(--s));padding:calc(18px*var(--s)) calc(10px*var(--s));color:#111}
.rbanner.win{background:#98ff98}
.rbanner.lose{background:#ff9b9b}
.rbanner h2{font-size:calc(42px*var(--s));line-height:1.12;font-weight:700}
.rlab{font-size:calc(30px*var(--s));font-weight:400;margin-top:calc(22px*var(--s))}
.rval{font-size:calc(52px*var(--s));font-weight:700;line-height:1.1}
.rico{width:calc(130px*var(--s));height:calc(130px*var(--s));margin:calc(24px*var(--s)) auto 0}
.rico img{width:100%;height:100%;object-fit:contain;display:block}
.rbox .wbtn{width:100%;margin-top:calc(26px*var(--s));font-weight:700;font-size:calc(28px*var(--s));padding:calc(14px*var(--s))}
.rbox .wbtn:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="l"><button id="menuBtn" aria-label="Open settings"><div class="icn" data-ic="MenuButton"></div></button></div><div class="icn logo" data-ic="Logo"></div>
    <div class="r"><span class="bal mono" id="bal"></span><div class="icn user" data-ic="profile"></div></div>
  </header>

  <main id="home">
    <div class="event-h"><div class="icn flag" data-ic="Flag"></div><div><h1 id="evTime"></h1><p class="mono" id="evInfo"></p></div></div>
    <div class="card"><h2>Win or Each Way</h2><div id="rows"></div></div>
  </main>
  <main class="mybets" id="mybets">
    <div class="wcard">
      <div class="wtop"><h1>Current<br>Wager</h1><p id="bLines"></p><button class="wbtn light" id="bView">View Results</button></div>
      <div class="whist"><h2>Wager History (<span id="bHist">0</span>)</h2><button class="wbtn dark" id="bShow">Show</button></div>
    </div>
  </main>

  <div id="slip" role="button" tabindex="0" aria-label="Confirm bet"><button class="chev" id="chev" aria-label="Toggle bet slip"><span class="icn" data-ic="Arrow"></span></button>
    <div class="msg" id="slipMsg"></div>
    
  </div>

  <nav>
    <button id="navHome"><div class="icn" data-ic="home"></div>Home</button>
    <button id="navBrowse"><div class="icn" data-ic="browse"></div>Browse</button>
    <button id="navBets"><div class="icn" data-ic="MyBets"></div>My Bets</button>
  </nav>

  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-hidden="true"><div class="cbox">
    <h2 id="cTitle">Confirm Bet?</h2>
    <p id="cText"></p>
    <div class="cbtns"><button id="cYes">Confirm</button><button id="cNo">Cancel</button></div>
  </div></div>
  <div id="luck" role="dialog" aria-modal="true" aria-labelledby="lTitle" aria-hidden="true"><div class="lbox">
    <button id="lClose" aria-label="Close"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5L29 29M29 5L5 29"/></svg></button>
    <h2 id="lTitle">Good Luck!</h2>
  </div></div>
  <div id="result" role="dialog" aria-modal="true" aria-labelledby="rTitle" aria-hidden="true"><div class="cbox rbox">
    <div id="rBanner" class="rbanner win"><h2 id="rTitle"></h2></div>
    <div id="rWin"><div class="rlab">Winnings:</div><div class="rval" id="rVal"></div></div>
    <div id="rLose"><div id="rIcon" class="rico"></div></div>
    <button id="rBtn" class="wbtn light"></button>
  </div></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="scrim"></div>
  <aside id="drawer" aria-label="Edit values">
    <button id="close">Close</button>
    <h3>Edit values</h3><p class="sub">Changes show on the betting screen instantly.</p>
    <div id="fields"></div>
  </aside>
</div>

<script>
const JDIR='Assets/jerseys_tight/';
const JERSEYS=[];for(let r=1;r<=5;r++)for(let c=1;c<=5;c++)JERSEYS.push(`r${r}_c${c}`);
const jsrc=j=>`${JDIR}jersey_${j}.png`;
const S={
  balance:500, time:'time val', going:'good', count:5, stakeIncl:true,
  horses:[
    {name:'Horse 1',jockey:'',trainer:'',age:'5',weight:'11-12',odds:'5/2',jersey:'r1_c3'},
    {name:'Horse 2',jockey:'name man',trainer:'name train',age:'5',weight:'11-12',odds:'3/1',jersey:'r4_c1'},
    {name:'Horse 3',jockey:'name man',trainer:'name train',age:'5',weight:'11-12',odds:'2/1',jersey:'r1_c5'},
    {name:'Horse 4',jockey:'name man',trainer:'name train',age:'5',weight:'11-12',odds:'6/1',jersey:'r3_c1'},
    {name:'Horse 5',jockey:'name man',trainer:'name train',age:'5',weight:'11-12',odds:'6/1',jersey:'r2_c5'}
  ],
  sel:new Set()
};
for(let n=S.horses.length;n<12;n++)S.horses.push({name:'Horse '+(n+1),jockey:'name man',trainer:'name train',age:'5',weight:'11-12',odds:'6/1',jersey:JERSEYS[(n*4+3)%25]});
Object.assign(S,{bet:null,past:0,outcome:'win',status:'ongoing',view:'home'});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderTop(){
  $('bal').textContent='Balance £'+money(S.balance); $('evTime').textContent=S.time; $('evInfo').textContent=S.count+(S.count===1?' runner':' runners')+' - '+S.going;
}
function renderRows(){
  $('rows').innerHTML=S.horses.slice(0,S.count).map((h,i)=>`
    <div class="row">
      <div class="num">${i+1}</div><div class="silk"><img src="${jsrc(h.jersey)}" alt="" onerror="this.parentNode.classList.add('ico');this.remove()"></div>
      <div class="info"><b>${esc(h.name)}</b>Jockey: ${esc(h.jockey)}<br>Trainer: ${esc(h.trainer)}<br>Age: ${esc(h.age)} | Weight: ${esc(h.weight)}</div>
      <button class="odds${S.sel.has(i)?' sel':''}" data-i="${i}" aria-pressed="${S.sel.has(i)}">${esc(h.odds)}</button>
    </div>`).join('');
  updateSlip();
}
function parseOdds(o){
  o=String(o).trim().toLowerCase();
  if(['evs','evens','even'].includes(o))return 1;
  const m=o.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if(m&&+m[2]>0)return +m[1]/+m[2];
  if(/^\d+(\.\d+)?$/.test(o))return +o;
  return null;
}
const money=n=>{const r=Math.round(n*100)/100;return r.toLocaleString('en-GB',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})};
function updateSlip(){
  const on=S.sel.size>0;
  if(on){
    const h=S.horses[[...S.sel][0]], d=parseOdds(h.odds), stake=S.balance;
    const ret=d===null?null:stake*d+(S.stakeIncl?stake:0);
    $('slipMsg').innerHTML='<b>£'+money(stake)+'</b> @ <b>'+esc(h.odds)+'</b> returns <b>'+(ret===null?'£—':'£'+money(ret))+'</b>';
  }
  $('slip').classList.toggle('show',on);
  $('home').classList.toggle('pad',on);
  if(!on)$('slip').classList.remove('open');
}
$('rows').addEventListener('click',e=>{
  const b=e.target.closest('.odds'); if(!b)return;
  const i=+b.dataset.i;
  const was=S.sel.has(i);
  S.sel.clear();
  if(!was)S.sel.add(i);
  renderRows();
  updateSlip();
});
$('chev').onclick=()=>{S.sel.clear();renderRows();};

// Confirm dialog
const dlg=$('confirm');
function openConfirm(){
  if(!S.sel.size)return;
  const h=S.horses[[...S.sel][0]], d=parseOdds(h.odds), stake=S.balance;
  const ret=d===null?null:stake*d+(S.stakeIncl?stake:0);
  $('cText').innerHTML='<b>£'+money(stake)+'</b> @ <b>'+esc(h.odds)+'</b><br>returns<br><b>'+(ret===null?'£—':'£'+money(ret))+'</b>';
  dlg.classList.add('show');dlg.setAttribute('aria-hidden','false');$('cYes').focus();
}
function closeConfirm(){dlg.classList.remove('show');dlg.setAttribute('aria-hidden','true');}
$('slip').addEventListener('click',e=>{if(!e.target.closest('#chev'))openConfirm()});
$('slip').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===$('slip')){e.preventDefault();openConfirm()}});
$('cNo').onclick=closeConfirm;
$('cYes').onclick=()=>{placeBet();closeConfirm();openLuck()};

// View Results overlay (win / lose set in the My Bets side panel)
const rs=$('result');
(()=>{const box=$('rIcon'),img=new Image();img.alt='Sad horse';img.onerror=()=>{box.classList.add('ico');img.remove()};img.src='Assets/Icons/sadHorse.png';box.append(img)})();
function openResult(){
  const b=S.bet; if(!b)return;
  const win=S.outcome==='win', btn=$('rBtn');
  $('rBanner').className='rbanner '+(win?'win':'lose');
  $('rTitle').textContent=win?'Winner!':'Better luck next time';
  $('rWin').style.display=win?'':'none';
  $('rLose').style.display=win?'none':'';
  $('rVal').textContent='£'+(b.ret===null?'—':money(b.ret));
  btn.textContent=win?(b.paid?'Added to balance':'Add to Balance'):'Play again';
  btn.disabled=win&&!!b.paid;
  rs.classList.add('show');rs.setAttribute('aria-hidden','false');btn.focus();
  if(win)blast();
}
function closeResult(){rs.classList.remove('show');rs.setAttribute('aria-hidden','true');}
$('bView').onclick=openResult;
$('rBtn').onclick=()=>{
  const b=S.bet;
  if(S.outcome==='win'){
    if(b&&!b.paid&&b.ret!==null){S.balance+=b.ret;b.paid=true;renderTop();buildDrawer();}
    closeResult();
  }else{closeResult();go('home');}
};
rs.addEventListener('click',e=>{if(e.target===rs)closeResult()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeResult()});

// Last placed bet (shown on My Bets)
function placeBet(){
  const h=S.horses[[...S.sel][0]]; if(!h)return;
  const d=parseOdds(h.odds), stake=S.balance;
  if(S.bet)S.past++;
  S.bet={time:S.time,horse:h.name,odds:h.odds,stake,ret:d===null?null:stake*d+(S.stakeIncl?stake:0)};
  S.status='ongoing';
  renderBets();
}
function renderBets(){
  const b=S.bet;
  $('bLines').innerHTML=b?'<b>'+esc(b.time)+'</b><br><b>'+esc(b.horse)+'</b><br>Potential return: <b>£'+(b.ret===null?'—':money(b.ret))+'</b><br>Status: <b>'+S.status+'</b>':'No bet placed yet.';
  $('bView').style.display=b?'':'none';
  $('bHist').textContent=S.past;
}

// Good Luck dialog + confetti
const lk=$('luck');
function openLuck(){lk.classList.add('show');lk.setAttribute('aria-hidden','false');$('lClose').focus();blast();}
function closeLuck(){
  if(!lk.classList.contains('show'))return;
  lk.classList.remove('show');lk.setAttribute('aria-hidden','true');
  S.sel.clear();renderRows();
}
$('lClose').onclick=closeLuck;
lk.addEventListener('click',e=>{if(e.target===lk)closeLuck()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLuck()});

const cv=$('confetti'),cx=cv.getContext('2d');
const CONF=['#ffffff','#ffffff','#9998d0','#7b79bd'];
let parts=[],raf=0,lastT=0,CW=0,CH=0;
function burst(n){
  const k=Math.max(.7,CH/900);
  for(let i=0;i<n;i++)for(const dir of [1,-1]){   // 1 = from bottom-left, -1 = from bottom-right
    const ang=(50+Math.random()*35)*Math.PI/180, sp=(15+Math.random()*17)*k;
    parts.push({x:dir>0?0:CW,y:CH,vx:dir*Math.cos(ang)*sp,vy:-Math.sin(ang)*sp,
      w:(7+Math.random()*8)*k,h:(4+Math.random()*5)*k,rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,
      wob:Math.random()*6.28,ws:.15+Math.random()*.2,life:140+Math.random()*70,age:0,c:CONF[Math.floor(Math.random()*CONF.length)]});
  }
}
function tick(t){
  const dt=Math.min(2,(t-lastT)/16.67||1);lastT=t;
  cx.clearRect(0,0,CW,CH);
  cx.fillStyle='#fff';cx.shadowColor='rgba(40,40,90,.5)';cx.shadowBlur=4;
  const drag=Math.pow(.985,dt),g=.5*Math.max(.7,CH/900)*dt;
  parts=parts.filter(p=>p.age<p.life&&p.y<CH+30);
  for(const p of parts){
    p.vx*=drag;p.vy=p.vy*drag+g;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.wob+=p.ws*dt;p.age+=dt;
    cx.save();cx.globalAlpha=Math.max(0,Math.min(1,(p.life-p.age)/40));
    cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.wob));
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  }
  if(parts.length){raf=requestAnimationFrame(tick)}else{raf=0;cx.clearRect(0,0,CW,CH)}
}
function blast(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dpr=window.devicePixelRatio||1;
  CW=app.clientWidth;CH=app.clientHeight;
  cv.width=CW*dpr;cv.height=CH*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  burst(70);
  setTimeout(()=>{if(document.querySelector('#luck.show,#result.show'))burst(40)},220);
  if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick)}
}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeConfirm()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConfirm()});

// Navigation
function go(view){
  S.view=view;buildDrawer();renderBets();
  $('home').style.display=view==='home'?'':'none';
  $('mybets').style.display=view==='bets'?'block':'none';
  $('slip').style.visibility=view==='home'?'visible':'hidden';
}
$('navHome').onclick=()=>go('home');
$('navBets').onclick=()=>go('bets');
// Browse intentionally does nothing

// Jerseys: images live in Assets/jerseys_tight/ next to this HTML file
function jerseyPicker(h){
  const d=document.createElement('details');
  d.innerHTML='<summary>Jersey</summary><div class="jgrid"></div>';
  const g=d.querySelector('.jgrid');
  JERSEYS.forEach(j=>{
    const b=document.createElement('button');b.type='button';b.title=j;b.className='jb'+(h.jersey===j?' on':'');
    b.innerHTML=`<img src="${jsrc(j)}" alt="${j}"><span>${j.replace('_','')}</span>`;
    b.querySelector('img').onerror=function(){b.classList.add('nofile');this.remove()};
    b.onclick=()=>{h.jersey=j;g.querySelectorAll('.jb').forEach(x=>x.classList.toggle('on',x===b));renderRows()};
    g.append(b);
  });
  return d;
}

// Side panel
function field(label,val,onInput,attrs=''){
  const d=document.createElement('div');
  d.innerHTML=`<label>${label}<input value="${esc(val)}" ${attrs}></label>`;
  const inp=d.querySelector('input');
  inp.addEventListener('input',e=>onInput(e.target.value,e.target));
  if(inp.type==='number'){
    inp.addEventListener('keydown',e=>{if(['e','E','+','-'].includes(e.key))e.preventDefault()});
    inp.addEventListener('change',e=>{const k=e.target.dataset.sync;if(k)e.target.value=S[k]});
  }
  return d;
}
function runnersBlock(){
  const box=$('runnersBox'); box.innerHTML='';
  S.horses.slice(0,S.count).forEach((h,i)=>{
    const fs=document.createElement('fieldset'); fs.innerHTML=`<legend>Runner ${i+1}</legend>`;
    const upd=k=>v=>{h[k]=v;renderRows()};
    const grid=document.createElement('div'); grid.className='two';
    grid.append(field('Odds',h.odds,upd('odds')),field('Name',h.name,upd('name')),
      field('Jockey',h.jockey,upd('jockey')),field('Trainer',h.trainer,upd('trainer')),
      field('Age',h.age,upd('age')),field('Weight',h.weight,upd('weight')));
    fs.append(grid,jerseyPicker(h)); box.append(fs);
  });
}
function balanceField(){
  return field('Balance (£) - numbers only',S.balance,v=>{const n=parseFloat(v);if(!isFinite(n)||n<0)return;S.balance=n;renderTop();updateSlip()},'type="number" min="0" step="any" inputmode="decimal" data-sync="balance"');
}
function buildDrawer(){
  const f=$('fields'); f.innerHTML='';
  if(S.view==='bets'){
    const g=document.createElement('fieldset'); g.innerHTML='<legend>My Bets</legend>';
    g.append(balanceField(),field('Wager history number',S.past,v=>{const n=parseInt(v,10);if(!(n>=0))return;S.past=n;renderBets()},'type="number" min="0" step="1" inputmode="numeric" data-sync="past"'));
    const cb=document.createElement('label'); cb.className='chk';
    cb.innerHTML='<input type="checkbox"'+(S.outcome==='win'?' checked':'')+'> <span></span>';
    const sp=cb.querySelector('span');
    const lbl=()=>{sp.textContent=S.outcome==='win'?'Result: WIN (untick for lose)':'Result: LOSE (tick for win)'};
    lbl();
    cb.querySelector('input').onchange=e=>{S.outcome=e.target.checked?'win':'lose';lbl()};
    const sb=document.createElement('label'); sb.className='chk';
    sb.innerHTML='<input type="checkbox"'+(S.status==='completed'?' checked':'')+'> <span></span>';
    const ss=sb.querySelector('span');
    const slbl=()=>{ss.textContent=S.status==='completed'?'Status: COMPLETED (untick for ongoing)':'Status: ONGOING (tick for completed)'};
    slbl();
    sb.querySelector('input').onchange=e=>{S.status=e.target.checked?'completed':'ongoing';slbl();renderBets()};
    g.append(cb,sb); f.append(g);
    return;
  }
  const g=document.createElement('fieldset'); g.innerHTML='<legend>General</legend>';
  g.append(
    field('Balance (£) - numbers only',S.balance,v=>{const n=parseFloat(v);if(!isFinite(n)||n<0)return;S.balance=n;renderTop();updateSlip()},'type="number" min="0" step="any" inputmode="decimal" data-sync="balance"'),
    field('Race time / title',S.time,v=>{S.time=v;renderTop()}),
    field('Number of runners (1-12)',S.count,v=>{const n=parseInt(v,10);if(!(n>=1))return;S.count=Math.min(12,n);[...S.sel].forEach(i=>{if(i>=S.count)S.sel.delete(i)});renderTop();renderRows();runnersBlock()},'type="number" min="1" max="12" step="1" inputmode="numeric" data-sync="count"'),
    field('Going',S.going,v=>{S.going=v;renderTop()})
  );
  const cb=document.createElement('label'); cb.className='chk';
  cb.innerHTML='<input type="checkbox"'+(S.stakeIncl?' checked':'')+'> Returns include the stake';
  cb.querySelector('input').onchange=e=>{S.stakeIncl=e.target.checked;updateSlip()};
  g.append(cb); f.append(g);
  const rb=document.createElement('div'); rb.id='runnersBox'; f.append(rb); runnersBlock();
}
const openD=o=>{$('drawer').classList.toggle('show',o);$('scrim').classList.toggle('show',o)};
$('menuBtn').onclick=()=>openD(true);
$('close').onclick=$('scrim').onclick=()=>openD(false);

// Rendering rows while typing would keep selection state, since it's stored in S.sel
// Icons: images live in Assets/Icons/ next to this HTML file (green box if missing)
const ICONS={Arrow:'0000_Arrow',profile:'0001_profile',Logo:'0002_Logo',home:'0003_home',MenuButton:'0004_MenuButton',browse:'0005_browse',MyBets:'0006_MyBets',Flag:'0007_Flag'};
document.querySelectorAll('[data-ic]').forEach(el=>{
  const img=new Image();img.alt='';
  img.onerror=()=>{el.classList.add('ico');img.remove()};
  img.src=`Assets/Icons/Icon__${ICONS[el.dataset.ic]}.png`;
  el.append(img);
});
renderTop(); renderRows(); buildDrawer(); updateSlip();

// Scale layout up as the window widens (max 1:1 aspect)
const app=$('app');
function fit(){const w=app.clientWidth;const s=Math.min(1.8,Math.max(1,1+(w/430-1)*0.6));document.documentElement.style.setProperty('--s',s.toFixed(3))}
new ResizeObserver(fit).observe(app);fit();
</script>
